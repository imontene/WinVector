name: Rendimiento

# Mide el motor con documentos de 500, 2.000 y 10.000 objetos (issue #34) y compara con la
# referencia de tools/perf/referencia.json. El arranque de la aplicación se mide en app.yml,
# justo después de instalar el paquete.
on:
  push:
    branches: [main]
    paths:
      - "src/engine/**"
      - "tools/perf/**"
      - ".github/workflows/rendimiento.yml"
  pull_request:
    paths:
      - "src/engine/**"
      - "tools/perf/**"
      - ".github/workflows/rendimiento.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rendimiento-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/engine

jobs:
  engine:
    name: Medir el motor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: src/engine/.nvmrc
          cache: npm
          cache-dependency-path: src/engine/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Medir
        run: npm run perf

      - name: Comparar con la referencia
        run: npm run perf:compare

      - name: Publicar los resultados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendimiento-motor
          path: src/engine/perf/resultados
          if-no-files-found: ignore
          retention-days: 30
