name: Aplicación

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "contracts/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "WinVector.slnx"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "contracts/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "WinVector.slnx"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  build:
    name: Compilar y empaquetar (${{ matrix.platform }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: src/engine/.nvmrc
          cache: npm
          cache-dependency-path: src/engine/package-lock.json

      - name: Compilar el motor
        working-directory: src/engine
        run: |
          npm ci
          npm run build

      - name: Instalar .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Caché de NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Pruebas de WinVector.Core
        if: matrix.platform == 'x64'
        run: dotnet test tests/WinVector.Core.Tests -c Release

      - name: Compilar la solución
        run: dotnet build WinVector.slnx -c Release -p:Platform=${{ matrix.platform }}

      - name: Instalar MSBuild de Visual Studio
        uses: microsoft/setup-msbuild@v3

      - name: Empaquetar MSIX de prueba
        run: >
          msbuild src/WinVector.App/WinVector.App.csproj
          /restore
          /p:Configuration=Release
          /p:Platform=${{ matrix.platform }}
          /p:RuntimeIdentifier=${{ matrix.rid }}
          /p:SelfContained=true
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=false
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxBundle=Never
          /p:AppxPackageDir=${{ github.workspace }}\artifacts\msix\
          /verbosity:minimal

      - name: Preparar el artefacto
        shell: pwsh
        run: |
          $arch = '${{ matrix.platform }}'.ToLowerInvariant()
          $package = Get-ChildItem artifacts/msix -Directory | Select-Object -First 1
          $out = New-Item -ItemType Directory -Force artifacts/upload
          New-Item -ItemType Directory -Force (Join-Path $out Dependencies) | Out-Null
          Copy-Item (Join-Path $package.FullName '*.msix') $out
          Copy-Item (Join-Path $package.FullName "Dependencies/$arch/*.msix") (Join-Path $out Dependencies)
          Copy-Item build/LEEME-paquete-de-prueba.txt $out
          Get-ChildItem -Recurse $out | Select-Object FullName, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } } | Format-Table -AutoSize

      - name: Prueba de humo (instalar y arrancar)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $out = Resolve-Path artifacts/upload
          Add-AppxPackage -Path (Get-ChildItem "$out/*.msix").FullName `
            -DependencyPath (Get-ChildItem "$out/Dependencies/*.msix").FullName -AllowUnsigned
          $app = Get-AppxPackage -Name WinVector
          if (-not $app) { throw 'El paquete no quedó instalado.' }
          Write-Host "Instalado: $($app.PackageFullName)"

          Start-Process "shell:AppsFolder\$($app.PackageFamilyName)!App"
          Start-Sleep -Seconds 15
          $process = Get-Process -Name WinVector -ErrorAction SilentlyContinue
          if (-not $process) { throw 'WinVector no está en ejecución 15 s después de arrancar.' }
          Write-Host "En ejecución: PID $($process.Id), ventana '$($process.MainWindowTitle)'"

          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          New-Item -ItemType Directory -Force artifacts/smoke | Out-Null
          $bitmap.Save((Join-Path (Resolve-Path artifacts/smoke) 'captura.png'), [System.Drawing.Imaging.ImageFormat]::Png)

          # TEMPORAL: imprime la captura reducida en el registro para revisarla sin descargar artefactos.
          $small = New-Object System.Drawing.Bitmap $bitmap, ([int]($bounds.Width * 0.75)), ([int]($bounds.Height * 0.75))
          $stream = New-Object System.IO.MemoryStream
          $small.Save($stream, [System.Drawing.Imaging.ImageFormat]::Png)
          [Convert]::ToBase64String($stream.ToArray()) -split '(.{4000})' | Where-Object { $_ } | ForEach-Object { Write-Host "CAPTURA:$_" }

          $process | Stop-Process
          Remove-AppxPackage $app.PackageFullName

      - name: Publicar la captura de la prueba de humo
        if: always() && matrix.platform == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: captura-prueba-de-humo
          path: artifacts/smoke
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar el MSIX
        uses: actions/upload-artifact@v7
        with:
          name: winvector-msix-${{ matrix.platform }}
          path: artifacts/upload
          if-no-files-found: error
          retention-days: 14
