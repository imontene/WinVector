name: Aplicación

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "contracts/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "WinVector.slnx"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "contracts/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "WinVector.slnx"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  build:
    name: Compilar y empaquetar (${{ matrix.platform }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: src/engine/.nvmrc
          cache: npm
          cache-dependency-path: src/engine/package-lock.json

      - name: Compilar el motor
        working-directory: src/engine
        run: |
          npm ci
          npm run build

      - name: Instalar .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Caché de NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Pruebas de WinVector.Core
        if: matrix.platform == 'x64'
        run: dotnet test tests/WinVector.Core.Tests -c Release

      - name: Compilar la solución
        run: dotnet build WinVector.slnx -c Release -p:Platform=${{ matrix.platform }}

      - name: Instalar MSBuild de Visual Studio
        uses: microsoft/setup-msbuild@v3

      - name: Empaquetar MSIX de prueba
        run: >
          msbuild src/WinVector.App/WinVector.App.csproj
          /restore
          /p:Configuration=Release
          /p:Platform=${{ matrix.platform }}
          /p:RuntimeIdentifier=${{ matrix.rid }}
          /p:SelfContained=true
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=false
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxBundle=Never
          /p:AppxPackageDir=${{ github.workspace }}\artifacts\msix\
          /verbosity:minimal

      - name: Preparar el artefacto
        shell: pwsh
        run: |
          $arch = '${{ matrix.platform }}'.ToLowerInvariant()
          $package = Get-ChildItem artifacts/msix -Directory | Select-Object -First 1
          $out = New-Item -ItemType Directory -Force artifacts/upload
          New-Item -ItemType Directory -Force (Join-Path $out Dependencies) | Out-Null
          Copy-Item (Join-Path $package.FullName '*.msix') $out
          Copy-Item (Join-Path $package.FullName "Dependencies/$arch/*.msix") (Join-Path $out Dependencies)
          Copy-Item build/LEEME-paquete-de-prueba.txt $out
          Get-ChildItem -Recurse $out | Select-Object FullName, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } } | Format-Table -AutoSize

      - name: Prueba de humo (instalar, arrancar y seleccionar)
        if: matrix.platform == 'x64'
        # Windows PowerShell 5.1: trae UI Automation y System.Drawing sin instalar nada. Lee el
        # script como ANSI, por eso los textos de este paso van sin tildes.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Resolve-Path artifacts/upload
          Add-AppxPackage -Path (Get-ChildItem "$out/*.msix").FullName `
            -DependencyPath (Get-ChildItem "$out/Dependencies/*.msix").FullName -AllowUnsigned
          $app = Get-AppxPackage -Name WinVector
          if (-not $app) { throw 'El paquete no quedo instalado.' }
          Write-Host "Instalado: $($app.PackageFullName)"

          Start-Process "shell:AppsFolder\$($app.PackageFamilyName)!App"
          Start-Sleep -Seconds 15
          $process = Get-Process -Name WinVector -ErrorAction SilentlyContinue
          if (-not $process) { throw 'WinVector no esta en ejecucion 15 s despues de arrancar.' }
          Write-Host "En ejecucion: PID $($process.Id), ventana '$($process.MainWindowTitle)'"

          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes, System.Windows.Forms, System.Drawing
          Add-Type -Namespace Smoke -Name Mouse -MemberDefinition @'
          [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
          [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, System.UIntPtr extra);
          '@
          $A = [System.Windows.Automation.AutomationElement]
          $window = $A::RootElement.FindFirst([System.Windows.Automation.TreeScope]::Children,
            (New-Object System.Windows.Automation.PropertyCondition($A::ProcessIdProperty, $process.Id)))
          if (-not $window) { throw 'No se encuentra la ventana de WinVector con UI Automation.' }
          # Recorre la vista completa (raw view): la busqueda por defecto solo ve la vista de controles.
          function Get-Elements {
            $walker = [System.Windows.Automation.TreeWalker]::RawViewWalker
            $queue = New-Object System.Collections.Queue
            $queue.Enqueue($window)
            while ($queue.Count -gt 0) {
              $node = $queue.Dequeue()
              $node
              $child = $walker.GetFirstChild($node)
              while ($child) { $queue.Enqueue($child); $child = $walker.GetNextSibling($child) }
            }
          }
          function Find-ById($id) {
            Get-Elements | Where-Object { $_.Current.AutomationId -eq $id } | Select-Object -First 1
          }

          $canvas = Find-ById 'EngineCanvas'
          if (-not $canvas) { throw 'No se encuentra el lienzo (AutomationId EngineCanvas).' }
          $r = $canvas.Current.BoundingRectangle
          Write-Host "Lienzo: $($r.X),$($r.Y) $($r.Width)x$($r.Height)"

          # Posicion del circulo #sol (300, 96) en el SVG de ejemplo (viewBox 400 x 300), que el motor
          # dibuja centrado con ancho min(90 % del ancho, 90 % del alto x 4/3).
          $w = [math]::Min($r.Width * 0.9, $r.Height * 0.9 * 4 / 3)
          $h = $w * 3 / 4
          $x = [int]($r.X + ($r.Width - $w) / 2 + $w * 300 / 400)
          $y = [int]($r.Y + ($r.Height - $h) / 2 + $h * 96 / 300)
          Write-Host "Clic en el circulo: $x,$y"
          [Smoke.Mouse]::SetCursorPos($x, $y) | Out-Null
          [Smoke.Mouse]::mouse_event(0x0002, 0, 0, 0, [System.UIntPtr]::Zero)
          [Smoke.Mouse]::mouse_event(0x0004, 0, 0, 0, [System.UIntPtr]::Zero)

          $selection = ''
          for ($i = 0; $i -lt 20 -and $selection -ne 'circle#sol'; $i++) {
            Start-Sleep -Milliseconds 250
            $selection = (Find-ById 'SelectionStatus').Current.Name
          }
          Write-Host "Barra de estado, seleccion: '$selection'"
          $engineStatus = Find-ById 'EngineStatus'
          Write-Host "Barra de estado, motor: '$($engineStatus.Current.Name)'"
          Write-Host "Latencia del puente (app.ping, ida y vuelta): '$($engineStatus.Current.HelpText)'"

          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          New-Item -ItemType Directory -Force artifacts/smoke | Out-Null
          $bitmap.Save((Join-Path (Resolve-Path artifacts/smoke) 'captura.png'), [System.Drawing.Imaging.ImageFormat]::Png)

          try {
          if ($selection -ne 'circle#sol') {
            Write-Host 'Elementos con AutomationId:'
            Get-Elements | Where-Object { $_.Current.AutomationId } | ForEach-Object {
              Write-Host "  $($_.Current.ControlType.ProgrammaticName) id='$($_.Current.AutomationId)' name='$($_.Current.Name)'"
            }
            throw "Se esperaba 'circle#sol' en la barra de estado y hay '$selection'."
          }
          } finally {
            $process | Stop-Process
            Remove-AppxPackage $app.PackageFullName
          }

      - name: Publicar la captura de la prueba de humo
        if: always() && matrix.platform == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: captura-prueba-de-humo
          path: artifacts/smoke
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar el MSIX
        uses: actions/upload-artifact@v7
        with:
          name: winvector-msix-${{ matrix.platform }}
          path: artifacts/upload
          if-no-files-found: error
          retention-days: 14
