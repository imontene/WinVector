name: Aplicación

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "contracts/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "WinVector.slnx"
      - "tools/perf/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "contracts/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "WinVector.slnx"
      - "tools/perf/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:
    inputs:
      ui_test_runs:
        description: "Veces que se repiten las pruebas de interfaz (para medir su estabilidad)"
        default: "1"

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  build:
    name: Compilar y empaquetar (${{ matrix.platform }})
    runs-on: windows-latest
    # Las ejecuciones repetidas de las pruebas de interfaz (ui_test_runs) necesitan más tiempo.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 120 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: src/engine/.nvmrc
          cache: npm
          cache-dependency-path: src/engine/package-lock.json

      - name: Compilar el motor
        working-directory: src/engine
        run: |
          npm ci
          npm run build

      - name: Instalar .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Caché de NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Pruebas de WinVector.Core
        if: matrix.platform == 'x64'
        run: dotnet test tests/WinVector.Core.Tests -c Release

      - name: Compilar la solución
        run: dotnet build WinVector.slnx -c Release -p:Platform=${{ matrix.platform }}

      - name: Instalar MSBuild de Visual Studio
        uses: microsoft/setup-msbuild@v3

      - name: Empaquetar MSIX de prueba
        run: >
          msbuild src/WinVector.App/WinVector.App.csproj
          /restore
          /p:Configuration=Release
          /p:Platform=${{ matrix.platform }}
          /p:RuntimeIdentifier=${{ matrix.rid }}
          /p:SelfContained=true
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=false
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxBundle=Never
          /p:AppxPackageDir=${{ github.workspace }}\artifacts\msix\
          /verbosity:minimal

      - name: Preparar el artefacto
        shell: pwsh
        run: |
          $arch = '${{ matrix.platform }}'.ToLowerInvariant()
          $package = Get-ChildItem artifacts/msix -Directory | Select-Object -First 1
          $out = New-Item -ItemType Directory -Force artifacts/upload
          New-Item -ItemType Directory -Force (Join-Path $out Dependencies) | Out-Null
          Copy-Item (Join-Path $package.FullName '*.msix') $out
          Copy-Item (Join-Path $package.FullName "Dependencies/$arch/*.msix") (Join-Path $out Dependencies)
          Copy-Item build/LEEME-paquete-de-prueba.txt $out
          Get-ChildItem -Recurse $out | Select-Object FullName, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } } | Format-Table -AutoSize

      - name: Instalar el paquete para las pruebas de interfaz
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $out = Resolve-Path artifacts/upload
          Add-AppxPackage -Path (Get-ChildItem "$out/*.msix").FullName `
            -DependencyPath (Get-ChildItem "$out/Dependencies/*.msix").FullName -AllowUnsigned
          $app = Get-AppxPackage -Name WinVector
          "WINVECTOR_AUMID=$($app.PackageFamilyName)!App" >> $env:GITHUB_ENV
          "WINVECTOR_PACKAGE=$($app.PackageFullName)" >> $env:GITHUB_ENV

      - name: Compilar las pruebas de interfaz
        if: matrix.platform == 'x64'
        run: dotnet build tests/WinVector.App.UITests -c Release

      # Antes de las demás pruebas, para que el primer arranque tras instalar sea en frío.
      - name: Medir el arranque
        if: matrix.platform == 'x64'
        shell: pwsh
        env:
          WINVECTOR_PERF_OUTPUT: ${{ github.workspace }}\artifacts\rendimiento\aplicacion.json
        run: |
          dotnet test tests/WinVector.App.UITests -c Release --no-build --filter "TestCategory=Rendimiento" `
            --logger "console;verbosity=detailed" --results-directory artifacts/ui-tests
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node tools/perf/compare.mjs $env:WINVECTOR_PERF_OUTPUT

      - name: Pruebas de interfaz (FlaUI)
        if: matrix.platform == 'x64'
        shell: pwsh
        env:
          UI_TEST_RUNS: ${{ inputs.ui_test_runs || '1' }}
        run: |
          $runs = [int]$env:UI_TEST_RUNS
          $results = @()
          for ($i = 1; $i -le $runs; $i++) {
            $watch = [Diagnostics.Stopwatch]::StartNew()
            $verbosity = if ($i -eq 1) { 'detailed' } else { 'minimal' }
            dotnet test tests/WinVector.App.UITests -c Release --no-build --filter "FullyQualifiedName~ShiftDiagTests" `
              --logger "trx;LogFileName=ui-$i.trx" --logger "console;verbosity=$verbosity" `
              --results-directory artifacts/ui-tests
            $results += [pscustomobject]@{ Ejecucion = $i; Correcta = ($LASTEXITCODE -eq 0); Segundos = [math]::Round($watch.Elapsed.TotalSeconds, 1) }
          }
          $results | Format-Table -AutoSize | Out-String | Write-Host
          $failed = @($results | Where-Object { -not $_.Correcta }).Count
          Write-Host "Ejecuciones: $runs. Fallidas: $failed."
          if ($failed -gt 0) { exit 1 }

      - name: Desinstalar el paquete
        if: always() && matrix.platform == 'x64' && env.WINVECTOR_PACKAGE != ''
        shell: pwsh
        run: Remove-AppxPackage $env:WINVECTOR_PACKAGE

      - name: Publicar los resultados de las pruebas de interfaz
        if: always() && matrix.platform == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: pruebas-de-interfaz
          path: artifacts/ui-tests
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar las mediciones del arranque
        if: always() && matrix.platform == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: rendimiento-aplicacion
          path: artifacts/rendimiento
          if-no-files-found: ignore
          retention-days: 30

      - name: Publicar el MSIX
        uses: actions/upload-artifact@v7
        with:
          name: winvector-msix-${{ matrix.platform }}
          path: artifacts/upload
          if-no-files-found: error
          retention-days: 14
